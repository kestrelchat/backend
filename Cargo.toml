[workspace]
resolver = "2"
members = [
    "crates/libs/common",
    "crates/libs/config",
    "crates/libs/postgres",
    "crates/libs/redis",
]

[package]
name = "dendryte"
version = "0.1.0"
edition = "2024"

[dependencies]
kestrel_common = { version = "0.1.0", path = "crates/libs/common", features = ["geoip", "user_agent", "hcaptcha"] }
kestrel_config = { version = "0.1.0", path = "crates/libs/config" }
kestrel_postgres = { version = "0.1.0", path = "crates/libs/postgres" }
kestrel_redis = { version = "0.1.0", path = "crates/libs/redis" }

base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.44", features = ["serde"] }
rocket = "0.5.1"
rocket_okapi = { version = "0.9.0", features = ["swagger"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
ulid = "1.2.1"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
serde_json = "1.0.149"
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
