[workspace]
resolver = "2"
members = [
    "crates/libs/common",
    "crates/libs/config",
]

[package]
name = "dendryte"
version = "0.1.0"
edition = "2024"

[dependencies]
kestrel_common = { version = "0.1.0", path = "crates/libs/common", features = ["geoip", "user_agent", "hcaptcha"] }
kestrel_config = { version = "0.1.0", path = "crates/libs/config" }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.44", features = ["serde"] }
rocket = "0.5.1"
rocket_okapi = { version = "0.9.0", features = ["swagger"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
ulid = "1.2.1"
zeroize = { version = "1.8.2", features = ["derive"] }
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
rustc-hash = "2.1.2"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio-native-tls"] }
thiserror = "2.0.18"

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
