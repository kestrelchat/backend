[package]
name = "kestrel_common"
version = "0.1.0"
edition = "2024"

[features]
geoip = ["dep:reqwest"]
user_agent = ["dep:uaparser", "dep:once_cell"]
hcaptcha = ["dep:hcaptcha"]

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.5"
chrono = { version = "0.4.44", features = ["serde"] }
once_cell = { version = "1.21.4", optional = true }
rand = { version = "0.10.1", features = ["sys_rng"] }
reqwest = { version = "0.13.3", features = ["json"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono"] }
totp-rs = { version = "5.7.1", features = ["zeroize"] }
uaparser = { version = "0.6.4", optional = true }
hcaptcha = { version = "3.2.1", optional = true }
schemars = { version = "0.8", features = ["chrono"] }
tokio = { version = "1.52.3", features = ["rt"] }
zeroize = { version = "1.8.2", features = ["derive"] }
